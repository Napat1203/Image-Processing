<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a href="{{ url_for('home') }}">Home</a>
      {% if staff %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>

    <h1>สวัสดี {{ user['username'] }}</h1>
    <p>role:
      {% if user['role'] == 'super' %}<span class="badge badge-super">เจ้าของ</span>
      {% elif user['role'] == 'admin' %}<span class="badge badge-admin">แอดมิน</span>
      {% else %}<span class="badge badge-user">ผู้ใช้</span>
      {% endif %}
    </p>

    <!-- Hand Detection Container -->
    <div class="video-container">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="controls">
      <button id="btn-start">Start</button>
      <button id="btn-stop" class="danger">Stop</button>
    </div>

    <div id="hand-status">พร้อมใช้งาน</div>
  </div>

  <!-- โหลดสคริปต์เรียงตามลำดับที่กำหนด -->
  <!-- 1) MediaPipe vision_bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js" crossorigin="anonymous"></script>
  <!-- 2) /static/js/hand_ai.js -->
  <script src="{{ url_for('static', filename='js/hand_ai.js') }}"></script>
  <!-- 3) /static/js/hand_ui.js -->
  <script src="{{ url_for('static', filename='js/hand_ui.js') }}"></script>
</body>
</html>
