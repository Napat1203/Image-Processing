<!DOCTYPE HTML>
<html lang="en">

<head>

    <title>LUMA - About</title>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, user-scalable=no">

    <!-- Hyperspace CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='assets/css/main.css') }}">

    <!-- LUMA CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <noscript>
        <link rel="stylesheet"
              href="{{ url_for('static', filename='assets/css/noscript.css') }}">
    </noscript>

</head>


<body>

    <!-- ================= Sidebar ================= -->

    <section id="sidebar">

        <div class="inner">

            <!-- Logo -->

            <div class="logo">
                LUMA
            </div>


            <!-- Navigation -->

            <nav>

                <ul>

                    <li>
                        <a href="{{ url_for('home') }}">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="{{ url_for('image') }}">
                            AI
                        </a>
                    </li>

                    <li>
                        <a href="{{ url_for('about') }}"
                           class="active">
                            About
                        </a>
                    </li>

                    {% if user and user['role'] in ['admin', 'super'] %}

                    <li>
                        <a href="{{ url_for('admin') }}">
                            Admin
                        </a>
                    </li>

                    {% endif %}


                    {% if user %}

                    <li>
                        <a href="{{ url_for('logout') }}">
                            Logout
                        </a>
                    </li>

                    {% else %}

                    <li>
                        <a href="{{ url_for('login') }}">
                            Login
                        </a>
                    </li>

                    {% endif %}

                </ul>

            </nav>


            <!-- Theme Toggle -->

            <label class="theme-toggle">

                <input type="checkbox">

                <span class="toggle-slider"></span>

            </label>

        </div>

    </section>


    <!-- ================= Main Content ================= -->

    <div id="wrapper">

        <section id="intro" class="wrapper style1 fullscreen">

            <div class="inner">

                <main class="home">

                    <section class="hero">

                        <h1>
                            Members
                        </h1>

                        <p>
                            6710301020 นางสาวพรพิรุณ ขามเทศ<br>
                            6710301034 นางสาวณภัทร ภูสระล้ำ<br>
                            6710301043 นายนที ผิวเกลี้ยง
                        </p>

                    </section>

                </main>

            </div>

        </section>

    </div>


    <!-- LUMA JavaScript -->

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
