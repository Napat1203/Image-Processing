<!DOCTYPE html>
<html lang="en">

    <head>
        <!-- Link to the style file -->
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <!--Help show thai correct characters-->
        <meta charset="UTF-8">
        <!--Help show fit page-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!--Title of the page-->
        <title>LUMA</title>
    </head>

    <body>
        <header class="navbar">
            <!-- Logo -->
            <div class="logo">
                LUMA
            </div>

            <!-- Navigation links -->
            <nav class="nav-menu">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('image') }}" class="active">AI</a>
                <a href="{{ url_for('about') }}">About</a>

                {% if user and user['role'] in ['admin', 'super'] %}
                    <a href="{{ url_for('admin') }}">Admin</a>
                {% endif %}

                <a href="{{ url_for('logout') }}">Logout</a>
            </nav>

            <!--Theme btn-->
            <label class="theme-toggle">
                <input type="checkbox"> <!--get status-->
                <span class="toggle-slider"></span> <!--output of the toggle-->
            </label>
        </header>

        <main class="ai-page">

            <section class="workspace">

                <!-- Welcome box -->
               <div class="welcome-box">
                    <h1>Welcome, User!</h1>

                    <p>
                        Let's create something with LUMA.
                    </p>
               </div> 

               <!--AI Mode Tabs-->
               <div class="ai-tabs">
                    <a href="{{ url_for('image') }}" class="ai-tab active">
                        Image
                    </a>
                    <a href="{{ url_for('webcam') }}" class="ai-tab">
                        Webcam
                    </a>
                    <a href="{{ url_for('txt2img') }}" class="ai-tab">
                        TXT2img
                    </a>
               </div>

                <!--Ai work area-->
               <div class="ai-work">

                    <!--Upload-->
                    <div class="upload-box">

                        <img id="image-preview" src="" alt="Image Preview">

                        <p id="file-name">
                            Upload Your Image
                        </p>
                        <input type="file" id="file-input" accept="image/*">
                        <button id="choose-file">
                            Choose File
                        </button>
                    </div>

                    <!--Middle-->
                    <div class="process">

                        <div class="model-select">

                            <button class="model-btn" id="model-btn">
                                Select AI Model ▼
                            </button>

                            <div class="model-menu" id="model-menu">
                                <button class="model-option">Model 1</button>
                                <button class="model-option">Model 2</button>
                                <button class="model-option">Model 3</button>
                            </div>

                        </div>

                        <div class="arrow">
                            →
                        </div>

                        <button class="generate-btn" id="generate-btn">
                            Generate
                        </button>

                    </div>

                    <!--Result-->
                    <div class="result-box">

                        <p id="result-text">
                            Result
                        </p>
                        <img id="result-image" src="" alt="AI Result"> 
                        <a id="download-btn" class="download-btn" href="#" download="luma-result.png">
                            Download
                        </a>
                    </div>

               </div>
            </section>

        </main>

        <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    </body>
</html>
