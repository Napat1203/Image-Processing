<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="wrap">
    <div class="nav">
      <a href="{{ url_for('home') }}">Home</a>
      {% if staff %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>

    <h1>สวัสดี {{ user['username'] }}</h1>
    <p>role:
      {% if user['role'] == 'super' %}<span class="badge badge-super">เจ้าของ</span>
      {% elif user['role'] == 'admin' %}<span class="badge badge-admin">แอดมิน</span>
      {% else %}<span class="badge badge-user">ผู้ใช้</span>
      {% endif %}
    </p>

    <!-- Image Upload -->
    <div class="image-section">

        <h2>เลือกรูปภาพ</h2>

        <input
            type="file"
            id="image-input"
            accept="image/*"
        >

        <div class="image-preview">
            <img
                id="image-preview"
                src=""
                alt="Preview"
                style="display: none;"
            >
        </div>

    </div>


    <!-- Model Selection -->
    <div class="model-section">

        <label for="model-select">เลือกโมเดล</label>

        <select id="model-select">
            <option value="model1">Model 1</option>
            <option value="model2">Model 2</option>
            <option value="model3">Model 3</option>
        </select>

    </div>


    <!-- Process Button -->
    <div class="controls">

        <button id="btn-process">
            ประมวลผล
        </button>

    </div>

    <div id="process-status">
        พร้อมใช้งาน
    </div>

    <!-- Hand Detection Container -->
    <div class="video-container">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="controls">
      <button id="btn-start">Start</button>
      <button id="btn-stop" class="danger">Stop</button>
    </div>

    <div id="hand-status">พร้อมใช้งาน</div>
  </div>

  <!-- โหลดสคริปต์เรียงตามลำดับที่กำหนด -->
<!-- 1) MediaPipe vision_bundle CDN เวอร์ชันเสถียร -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js" crossorigin="anonymous"></script>
  <!-- 2) /static/js/hand_ai.js (เพิ่ม type="module" เพื่อรองรับ ES Module Import) -->
  <script type="module" src="{{ url_for('static', filename='js/hand_ai.js') }}"></script>
  <!-- 3) /static/js/hand_ui.js -->
  <script src="{{ url_for('static', filename='js/hand_ui.js') }}"></script>
</body>
</html>
