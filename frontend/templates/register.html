<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Help show Thai correct characters -->
    <meta charset="UTF-8">

    <!-- Help show fit page -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to the style file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Title of the page -->
    <title>LUMA - Register</title>

</head>


<body>

    <!-- ================= Navbar ================= -->

    <header class="navbar">

        <!-- Logo -->
        <div class="logo">
            LUMA
        </div>


        <!-- Navigation links -->
        <nav class="nav-menu">

            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('image')}}">AI</a>
            <a href="{{ url_for('about')}}">About</a>
            <a href="{{ url_for('login')}}" class="active">Login</a>
          
        </nav>


        <!-- Theme button -->
        <label class="theme-toggle">

            <input type="checkbox">

            <span class="toggle-slider"></span>

        </label>

    </header>


    <!-- ================= Register ================= -->

    <main class="auth-page">

        <h1 class="auth-title">
            Register
        </h1>


        <section class="auth-box register-box">

            <form method="POST" action="{{ url_for('register') }}">

              <!-- Username -->
              <input
                type="text"
                name="username"
                class="auth-input"
                placeholder="Username"
                required
              >

              <!-- Password -->
              <input
                type="password"
                name="password"
                class="auth-input"
                placeholder="Password"
                required
              >

              <!-- Confirm Password -->
              <input
                type="password"
                class="auth-input"
                placeholder="Confirm Password"
                required
              >

              <!-- Register button -->
              <button type="submit" class="auth-btn">
                Register
              </button>

            </form>

            <!-- Error message -->
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <!-- Login link -->
            <div class="auth-link-area">

                <p>
                    Already have an account?
                </p>

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </div>

        </section>

    </main>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
