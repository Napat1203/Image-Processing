<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Help show Thai correct characters -->
    <meta charset="UTF-8">

    <!-- Help show fit page -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to the style file -->
    <link rel="stylesheet" href="style.css">

    <!-- Title of the page -->
    <title>LUMA - Register</title>

</head>


<body>

    <!-- ================= Navbar ================= -->

    <header class="navbar">

        <!-- Logo -->
        <div class="logo">
            LUMA
        </div>


        <!-- Navigation links -->
        <nav class="nav-menu">

            <a href="home.html">
                Home
            </a>

            <a href="ai.html">
                AI
            </a>

            <a href="about.html">
                About
            </a>

            <a href="login.html" class="active">
                Login
            </a>

        </nav>


        <!-- Theme button -->
        <label class="theme-toggle">

            <input type="checkbox">

            <span class="toggle-slider"></span>

        </label>

    </header>


    <!-- ================= Register ================= -->

    <main class="auth-page">

        <h1 class="auth-title">
            Register
        </h1>


        <section class="auth-box register-box">

            <!-- Username -->
            <input
                type="text"
                class="auth-input"
                placeholder="Username"
            >


            <!-- Password -->
            <input
                type="password"
                class="auth-input"
                placeholder="Password"
            >


            <!-- Confirm Password -->
            <input
                type="password"
                class="auth-input"
                placeholder="Confirm Password"
            >


            <!-- Register button -->
            <button class="auth-btn">
                Register
            </button>


            <!-- Login link -->
            <div class="auth-link-area">

                <p>
                    Already have an account?
                </p>

                <a href="login.html">
                    Login
                </a>

            </div>

        </section>

    </main>
    
    <script src="script.js"></script>

</body>

</html>
