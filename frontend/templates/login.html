<!DOCTYPE HTML>
<html lang="en">

<head>

    <title>LUMA - Login</title>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, user-scalable=no">

    <!-- Hyperspace CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='assets/css/main.css') }}">

    <!-- LUMA CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <noscript>
        <link rel="stylesheet"
              href="{{ url_for('static', filename='assets/css/noscript.css') }}">
    </noscript>

</head>


<body>

    <!-- ================= Sidebar ================= -->

    <section id="sidebar">

        <div class="inner">

            <!-- Logo -->
            <div class="logo">
                LUMA
            </div>


            <!-- Navigation -->
            <nav>

                <ul>

                    <li>
                        <a href="{{ url_for('home') }}">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="{{ url_for('image') }}">
                            AI
                        </a>
                    </li>

                    <li>
                        <a href="{{ url_for('about') }}">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="{{ url_for('login') }}" class="active">
                            Login
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </section>


    <!-- ================= Main Content ================= -->

    <div id="wrapper">

        <section id="intro" class="wrapper style1 fullscreen">

            <div class="inner">

                <!-- Login -->

                <main class="auth-page">

                    <h1 class="auth-title">
                        Login
                    </h1>


                    <section class="auth-box">

                        <form method="POST"
                              action="{{ url_for('login') }}">

                            <!-- Username -->
                            <input
                                type="text"
                                name="username"
                                class="auth-input"
                                placeholder="Username"
                                required
                            >


                            <!-- Password -->
                            <input
                                type="password"
                                name="password"
                                class="auth-input"
                                placeholder="Password"
                                required
                            >


                            <!-- Login button -->
                            <button type="submit"
                                    class="auth-btn">
                                Log in
                            </button>

                        </form>


                        <!-- Error message -->
                        {% if error %}

                            <p class="error">
                                {{ error }}
                            </p>

                        {% endif %}


                        <!-- Register link -->
                        <div class="auth-link-area">

                            <p>
                                Don’t have an account?
                            </p>

                            <a href="{{ url_for('register') }}">
                                Create Account
                            </a>

                        </div>

                    </section>

                </main>

            </div>

        </section>

    </div>


    <!-- LUMA JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
